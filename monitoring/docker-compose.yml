name: monitoring

networks:
  homelab:
    external: true

# Named volumes: Loki (uid 10001) and Grafana (uid 472) don't run as root, bind mounts would need chown.
volumes:
  loki-data:
  grafana-data:
  alloy-data:

services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    networks: [homelab]
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    networks: [homelab]
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data  # read positions, avoids re-shipping logs on restart
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/log/immich-backup:/var/log/immich-backup:ro
    depends_on: [loki]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks: [homelab]
    env_file: .env
    environment:
      - TZ=Europe/Madrid
      - GF_SERVER_ROOT_URL=https://grafana.local
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [loki]
    restart: unless-stopped
